[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tex-pace"
version = "0.1.0"
description = "Log LaTeX word and page counts on every LaTeX Workshop build, and plot them over time."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pypdf>=4.0",
    "matplotlib>=3.6",
    "tomli>=1.1; python_version < '3.11'",
]

[project.scripts]
tex-pace = "tex_pace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
